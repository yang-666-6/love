<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>爱心弹窗祝福</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111111;
        }
        .tip-box {
            position: absolute;
            width: 150px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "微软雅黑", sans-serif;
            font-size: 14px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }
        /* 手机屏幕缩小卡片尺寸 */
        @media (max-width: 480px) {
            .tip-box {
                width: 120px;
                height: 50px;
                font-size:12px;
            }
        }
    </style>
</head>
<body>
<script>
const tips = ["学业有成", "好好爱自己", "好好吃饭", "保持好心情",
        "身体健康", "顺顺利利", "别熬夜", "天凉了多穿衣服"]
const colors = ["pink", "lightblue", "lightgreen", "lemonchiffon",
        "hotpink", "skyblue"]

let boxes = [];

// 生成爱心坐标，等比例缩放，手机竖屏不会变形
function heart_points(n, screen_w, screen_h){
    const points = [];
    const baseScale = Math.min(screen_w, screen_h) / 600;
    // 手机小屏幕进一步缩小缩放系数
    const scaleFactor = screen_w < 480 ? baseScale * 0.8 : baseScale;
    for(let i=0;i<n;i++){
        const t = i / n * 2 * Math.PI;
        const x = 16 * Math.sin(t)**3;
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        let boxW = screen_w < 480 ? 120 :150;
        let boxH = screen_w < 480 ? 50 :60;
        let sx = screen_w / 2 + x * 20 * scaleFactor - boxW/2;
        let sy = screen_h / 2 - y * 20 * scaleFactor - boxH/2;
        sx = Math.max(0, Math.min(sx, screen_w - boxW));
        sy = Math.max(0, Math.min(sy, screen_h - boxH));
        points.push([sx, sy]);
    }
    return points;
}

// 创建弹窗盒子
function createPopup(x,y,tipText){
    const div = document.createElement("div");
    div.className = "tip-box";
    const bg = colors[Math.floor(Math.random()*colors.length)];
    div.style.background = bg;
    div.style.left = x + "px";
    div.style.top = y + "px";
    div.innerText = tipText || tips[Math.floor(Math.random()*tips.length)];
    document.body.appendChild(div);
    boxes.push(div);

    //电脑：空格键关闭卡片
    const keyClose = (e)=>{
        if(e.code === 'Space'){
            div.remove();
            window.removeEventListener('keydown', keyClose);
        }
    }
    window.addEventListener('keydown', keyClose);

    //手机：点击卡片直接关闭（适配触屏）
    div.addEventListener('click', ()=>{
        div.remove();
    })
    return div;
}

// 延时函数
function sleep(ms){
    return new Promise(resolve=>setTimeout(resolve,ms));
}

async function run(){
    // 修正手机视口高度，排除浏览器地址栏
    const sw = document.documentElement.clientWidth;
    const sh = document.documentElement.clientHeight;
    boxes = [];
    document.body.innerHTML = "";

    // 阶段一：爱心轨迹依次弹出
    const points = heart_points(100, sw, sh);
    for(let i=0;i<points.length;i++){
        const [x,y] = points[i];
        const text = i === points.length-1 ? "我喜欢你" : null;
        createPopup(x,y,text);
        await sleep(30);
    }

    await sleep(1000);
    // 清空爱心阶段弹窗
    for(let el of boxes){
        el.remove();
    }
    boxes = [];

    // 阶段二：满屏随机弹窗
    const boxW = sw <480 ?120:150;
    const boxH = sw <480 ?50:60;
    const count = Math.floor((sw / boxW) * (sh / boxH)) + 50;
    for(let i=0;i<count;i++){
        const x = Math.floor(Math.random() * (sw - boxW));
        const y = Math.floor(Math.random() * (sh - boxH));
        createPopup(x,y);
        await sleep(5);
    }

    // 等待10秒
    await sleep(10000);

    // 阶段三：逐个优雅关闭弹窗
    const interval = 1000 / boxes.length;
    for(let el of boxes){
        el.remove();
        await sleep(interval);
    }
}

// 屏幕旋转自动重跑动画
window.addEventListener('resize', ()=>{
    run();
})

run();
</script>
</body>
</html>
