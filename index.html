<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>爱心弹窗祝福</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #111111;
        }
        .tip-box {
            position: absolute;
            width: 150px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "微软雅黑", sans-serif;
            font-size: 14px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.25);
        }
        @media (max-width: 480px) {
            .tip-box {
                width: 120px;
                height: 50px;
                font-size:12px;
            }
        }
    </style>
</head>
<body>
<script>
const tips = ["学业有成", "好好爱自己", "好好吃饭", "保持好心情",
        "身体健康", "顺顺利利", "别熬夜", "天凉了多穿衣服"]
const colors = ["pink", "lightblue", "lightgreen", "lemonchiffon",
        "hotpink", "skyblue"]

let boxes = [];

// 【重点修复】分开X、Y缩放，保证爱心不会压扁拉长
function heart_points(n, screen_w, screen_h){
    const points = [];
    // 限定爱心最大可用区域，强制爱心保持比例
    const maxSize = Math.min(screen_w, screen_h) * 0.75;
    const scale = maxSize / 36;

    const boxW = screen_w < 480 ? 120 : 150;
    const boxH = screen_w < 480 ? 50 : 60;

    for(let i=0;i<n;i++){
        const t = i / n * 2 * Math.PI;
        const x = 16 * Math.sin(t)**3;
        const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);

        // 分别缩放x,y，保持爱心原始比例
        let px = screen_w / 2 + x * scale - boxW/2;
        let py = screen_h / 2 - y * scale - boxH/2;

        px = Math.max(0, Math.min(px, screen_w - boxW));
        py = Math.max(0, Math.min(py, screen_h - boxH));
        points.push([px, py]);
    }
    return points;
}

// 创建卡片
function createPopup(x,y,tipText){
    const div = document.createElement("div");
    div.className = "tip-box";
    const bg = colors[Math.floor(Math.random()*colors.length)];
    div.style.background = bg;
    div.style.left = x + "px";
    div.style.top = y + "px";
    div.innerText = tipText || tips[Math.floor(Math.random()*tips.length)];
    document.body.appendChild(div);
    boxes.push(div);

    //电脑空格关闭
    const keyEvt = (e)=>{
        if(e.code === "Space"){
            div.remove();
            window.removeEventListener("keydown", keyEvt);
        }
    }
    window.addEventListener("keydown", keyEvt);
    //手机点击关闭卡片
    div.onclick = ()=> div.remove();
    return div;
}

function sleep(ms){
    return new Promise(resolve=>setTimeout(resolve, ms));
}

async function run(){
    const sw = document.documentElement.clientWidth;
    const sh = document.documentElement.clientHeight;
    boxes = [];
    document.body.innerHTML = "";

    //阶段1：爱心成型
    const points = heart_points(100, sw, sh);
    for(let i=0; i<points.length; i++){
        const [x,y] = points[i];
        const txt = i === points.length-1 ? "我喜欢你" : null;
        createPopup(x,y,txt);
        await sleep(30);
    }

    await sleep(1000);
    //清除爱心卡片
    for(let el of boxes) el.remove();
    boxes = [];

    //阶段2：随机铺满屏幕
    const boxW = sw <480 ?120:150;
    const boxH = sw <480 ?50:60;
    const count = Math.floor((sw / boxW) * (sh / boxH)) + 50;
    for(let i=0; i<count; i++){
        const rx = Math.floor(Math.random() * (sw - boxW));
        const ry = Math.floor(Math.random() * (sh - boxH));
        createPopup(rx, ry);
        await sleep(5);
    }

    await sleep(10000);
    //阶段3：逐个消失
    const stepTime = 1000 / boxes.length;
    for(let el of boxes){
        el.remove();
        await sleep(stepTime);
    }
}

// 屏幕尺寸变化重跑
window.addEventListener('resize', ()=> run());
run();
</script>
</body>
</html>
